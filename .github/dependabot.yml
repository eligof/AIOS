version: 2

updates:
  # Rust dependencies for the two Cargo workspaces.
  - package-ecosystem: cargo
    directory: /aios-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(aios-cli)"

  - package-ecosystem: cargo
    directory: /sentinel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(sentinel)"

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(actions)"
