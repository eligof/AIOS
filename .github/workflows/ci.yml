name: CI

# Portable regression gate. The ISO build (`make iso`) and end-to-end tests
# (`make e2e`) need an Arch host with pacstrap/mkarchiso and KVM, which GitHub's
# hosted runners do not provide, so they stay local-only. `make check` is the
# subset that runs anywhere: the Rust workspaces (aios-cli on stable, sentinel on
# its pinned nightly), shellcheck, bats, systemd unit verification, and pytest.

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + clippy + rustfmt)
        run: |
          rustup toolchain install stable --profile minimal -c clippy -c rustfmt
          rustup default stable
          rustc --version && cargo --version

      # The eBPF object is built on the project's pinned nightly (see
      # sentinel/rust-toolchain.toml and ebpf-loadtest/build.rs, which passes this
      # exact channel to aya-build's `rustup run`). rust-src backs `-Z build-std=core`
      # for the bpfel-unknown-none target. Install it explicitly rather than leaning on
      # rust-toolchain.toml auto-install, which does not fire for aya-build's sub-cargo.
      - name: Install pinned nightly for the eBPF build
        run: rustup toolchain install nightly-2026-11-03 --profile minimal -c rust-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache cargo and target directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aios-cli/target
            sentinel/target
          key: cargo-${{ runner.os }}-${{ hashFiles('aios-cli/Cargo.lock', 'sentinel/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # clang compiles the C CO-RE shim; llvm/libelf-dev back the eBPF build. `make tools`
      # installs bpf-linker (pinned), whose first uncached build adds a few minutes to CI.
      - name: Install clang + bpf prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang llvm libelf-dev

      - name: Fetch pinned tools (shellcheck, bats, pytest venv)
        run: make tools

      # Builds both Rust workspaces (aios-cli on stable, sentinel on the pinned nightly
      # installed above, including the embedded eBPF object) plus the shell/python gates.
      - name: make check
        run: make check

  audit:
    name: audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit aios-cli dependencies
        run: cd aios-cli && cargo audit

      # sentinel/ only exists on branches that carry the Sentinel work.
      - name: Audit sentinel dependencies
        run: |
          if [ -d sentinel ]; then
            (cd sentinel && cargo audit)
          else
            echo "sentinel/ is not on this branch — skipping"
          fi
