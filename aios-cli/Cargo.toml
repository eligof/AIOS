[workspace]
resolver = "2"
members = ["crates/aios-manifest", "crates/aios-gen", "crates/aios-render"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"
