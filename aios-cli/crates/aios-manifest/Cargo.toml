[package]
name = "aios-manifest"
description = "Parse and validate the AIOS system manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
# The [sentinel] section and the rule files are validated by the same crate the
# daemon uses, so `aios plan` reports exactly what sentineld would (spec §17.9).
sentinel-rules = { path = "../../../sentinel/crates/sentinel-rules" }

[dev-dependencies]
tempfile.workspace = true
