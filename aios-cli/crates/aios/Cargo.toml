[package]
name = "aios"
description = "The AIOS command line: plan, apply, roll back and collect generations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aios"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["test-hooks"]

[features]
# The AIOS_* overrides (paths, AIOS_FAKE_RUNNER, AIOS_TEST_PASSWORD) the CLI tests use.
# Off by default: a release build reads no AIOS_* variable.
test-hooks = ["aios-exec/test-hooks"]

[dependencies]
aios-exec = { path = "../aios-exec" }
aios-gen = { path = "../aios-gen" }
aios-manifest = { path = "../aios-manifest" }
clap.workspace = true
rpassword.workspace = true
# unshare and mount propagation for the private mount namespace (context.rs).
rustix = { workspace = true, features = ["mount", "thread"] }

[dev-dependencies]
aios-plan = { path = "../aios-plan" }
rustix.workspace = true
tempfile.workspace = true
