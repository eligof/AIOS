# AIOS keeps USBGuard's rule file in the persisted /var/lib/usbguard (spec §5.5), since
# /etc does not survive a reboot. usbguard.service makes / read-only (ReadOnlyPaths=-/), so
# without this `usbguard allow-device -p` fails with EROFS when it saves the rule.
# Shipped by aios-base in /usr/lib/systemd/system/usbguard.service.d/.

[Service]
ReadWritePaths=-/var/lib/usbguard
