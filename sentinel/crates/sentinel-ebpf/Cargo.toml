[package]
name = "sentinel-ebpf"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aya-ebpf = "0.3"
aya-log-ebpf = "0.1"
sentinel-common = { path = "../sentinel-common", default-features = false }

[[bin]]
name = "sentinel-ebpf"
path = "src/main.rs"

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
